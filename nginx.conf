server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/csv;

    # Serve index.html without aggressive caching so updates reflect immediately
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Serve historical dataset files from ./data with directory listing & CORS
    location /data/ {
        alias /usr/share/nginx/html/data/;
        autoindex on;
        autoindex_format json;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=3600";
    }
}
